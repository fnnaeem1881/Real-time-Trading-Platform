# Full stack: PHP 8.3 + Swoole trading app, TimescaleDB, and Redis.
#   docker compose up -d --build          # bring the stack up
#   docker compose run --rm app php bin/persist.php 600   # push data to Postgres
#   open http://127.0.0.1:8080            # live dashboard (Swoole-served)
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      PG_DSN: "pgsql:host=postgres;port=5432;dbname=trading"
      PG_USER: trading
      PG_PASS: trading
      REDIS_HOST: redis
      TRADER_ACCOUNT: MEHEDI-HASAN
      TRADER_NAME: "Mehedi Hasan"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_USER: trading
    ports:
      - "5432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
